<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  </head>
<body>

  <div class="topbar">
    내 정보
  </div>

  <div class="container">
    <div class="form-group">
      <label for="name">1. 이름</label>
      <input type="text" id="name" name="name">
    </div>
    
    <div class="form-group">
      <label for="studentId">2. 학번</label>
      <input type="text" id="studentId" name="studentId">
    </div>
    
    <div class="form-group">
      <label for="major">3. 학과</label>
      <input type="text" id="major" name="major">
    </div>
    
    <div class="form-group">
      <label>4. 회원 구분</label>
      <div class="radio-group">
        <label><input type="radio" name="member" value="1"> 준회원</label>
        <label><input type="radio" name="member" value="2"> 정회원</label>
        <label><input type="radio" name="member" value="3"> 휴회원</label>
      </div>
    </div>
    
    <div class="form-group">
      <label for="etc">5. 기타</label>
      <input type="text" id="etc" name="etc" class="etc-box">
    </div>
  </div>

  <button class="floating-btn">제출</button>

</body>
</html>
